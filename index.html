<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menü-Editor</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1b1f24;--mut:#6b7280;--bd:#e2e5ea;--ac:#4f46e5;--dg:#dc2626}
[data-theme=dark]{--bg:#0f1115;--card:#181b21;--tx:#e6e8ec;--mut:#8b93a1;--bd:#2a2f38;--ac:#818cf8;--dg:#f87171}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--bd)}
header h1{font-size:18px;margin:0;flex:1}
main{max-width:860px;margin:0 auto;padding:20px}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 12px}
button:hover{border-color:var(--ac);color:var(--ac)}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}
button.i{padding:4px 8px;color:var(--mut)}
button.d:hover{color:var(--dg);border-color:var(--dg)}
input,textarea{font:inherit;color:var(--tx);background:transparent;border:1px solid transparent;border-radius:6px;padding:5px 8px;width:100%}
input:hover,textarea:hover{border-color:var(--bd)}
input:focus,textarea:focus{outline:none;border-color:var(--ac);background:var(--card)}
.sec{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:16px}
.sh{display:flex;gap:6px;align-items:center}
.sh input{font-size:18px;font-weight:700}
.item{display:grid;grid-template-columns:1.2fr 2fr 90px auto;gap:6px;align-items:start;padding:6px 0;border-top:1px dashed var(--bd)}
.item textarea{resize:vertical;min-height:34px}
.acts{display:flex;gap:2px}
.note{font-size:13px;color:var(--mut)}
.add{margin-top:8px}
#title{font-size:24px;font-weight:800;margin-bottom:12px}
.md{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-top:24px}
.md textarea{min-height:260px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;border-color:var(--bd);resize:vertical}
.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center}
.toast{color:var(--ac);font-size:13px}
@media(max-width:640px){.item{grid-template-columns:1fr 80px auto}.item .desc{grid-column:1/3;grid-row:2}}
</style>
</head>
<body>
<header>
<h1>🍽️ Menü-Editor</h1>
<button id="addSec" class="p">+ Kategorie</button>
<button id="reset" class="d">Leeren</button>
<button id="theme">🌓</button>
</header>
<main>
<input id="title" placeholder="Menü-Titel">
<div id="app"></div>
<section class="md">
<strong>Markdown</strong>
<span class="note"> – hier Markdown einfügen und „Übernehmen“ klicken, oder das Ergebnis kopieren.</span>
<textarea id="md" spellcheck="false" placeholder="# Mein Menü&#10;&#10;## Vorspeisen&#10;- **Suppe** — Tomate, Basilikum — 6,50 €"></textarea>
<div class="row">
<button id="apply" class="p">⬇ Übernehmen (MD → Editor)</button>
<button id="copy">📋 Kopieren</button>
<button id="dl">💾 .md herunterladen</button>
<span id="toast" class="toast"></span>
</div>
</section>
</main>
<script>
const KEY='menu-editor-v1';
let S={title:'Mein Menü',sections:[]};
const $=s=>document.querySelector(s);
const SEP=' — ';
function parse(md){
  const r={title:'',sections:[]};let cur=null;
  for(let raw of md.split(/\r?\n/)){
    const l=raw.trim();if(!l)continue;
    let m;
    if(m=l.match(/^#\s+(.*)/)){r.title=m[1];}
    else if(m=l.match(/^#{2,6}\s+(.*)/)){cur={title:m[1],note:'',items:[]};r.sections.push(cur);}
    else if(m=l.match(/^[-*+]\s+(.*)/)){
      if(!cur){cur={title:'Allgemein',note:'',items:[]};r.sections.push(cur);}
      const p=m[1].split(/\s+[—–|]\s+|\s+-\s+/).map(x=>x.trim());
      const name=p[0].replace(/^\*\*(.*)\*\*$/,'$1');
      const isPrice=x=>/\d/.test(x)&&x.length<=14;
      let desc='',price='';
      if(p.length>=3){price=p[p.length-1];desc=p.slice(1,-1).join(SEP);}
      else if(p.length==2){isPrice(p[1])?price=p[1]:desc=p[1];}
      cur.items.push({name,desc,price});
    } else if(cur){cur.note+=(cur.note?'\n':'')+l;}
    else if(!r.title){r.title=l;}
  }
  return r;
}
function toMD(){
  let o='# '+(S.title||'Menü')+'\n';
  for(const s of S.sections){
    o+='\n## '+s.title+'\n';
    if(s.note)o+='\n'+s.note+'\n';
    if(s.items.length)o+='\n';
    for(const i of s.items){
      let line='- **'+i.name+'**';
      if(i.desc)line+=SEP+i.desc;
      if(i.price)line+=SEP+i.price;
      o+=line+'\n';
    }
  }
  return o;
}
function save(){localStorage.setItem(KEY,JSON.stringify(S));$('#md').value=toMD();}
function mv(a,i,d){const j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}
function render(){
  $('#title').value=S.title;
  const app=$('#app');app.innerHTML='';
  S.sections.forEach((s,si)=>{
    const d=document.createElement('div');d.className='sec';
    d.innerHTML=`<div class="sh"><input data-f="title" value="${esc(s.title)}" placeholder="Kategorie">
    <div class="acts"><button class="i" data-a="up">↑</button><button class="i" data-a="down">↓</button><button class="i d" data-a="del">✕</button></div></div>
    <input data-f="note" class="note" value="${esc(s.note||'')}" placeholder="Notiz (optional)">
    ${s.items.map((it,ii)=>`<div class="item" data-i="${ii}">
      <input data-f="name" value="${esc(it.name)}" placeholder="Name">
      <textarea data-f="desc" class="desc" rows="1" placeholder="Beschreibung">${esc(it.desc)}</textarea>
      <input data-f="price" value="${esc(it.price)}" placeholder="Preis">
      <div class="acts"><button class="i" data-a="iup">↑</button><button class="i" data-a="idown">↓</button><button class="i" data-a="dup">⧉</button><button class="i d" data-a="idel">✕</button></div>
    </div>`).join('')}
    <button class="add" data-a="add">+ Eintrag</button>`;
    d.addEventListener('input',e=>{
      const f=e.target.dataset.f;if(!f)return;
      const it=e.target.closest('.item');
      if(it)s.items[+it.dataset.i][f]=e.target.value;else s[f]=e.target.value;
      save();
    });
    d.addEventListener('click',e=>{
      const a=e.target.dataset.a;if(!a)return;
      const it=e.target.closest('.item');const ii=it?+it.dataset.i:-1;
      if(a=='up')mv(S.sections,si,-1);
      if(a=='down')mv(S.sections,si,1);
      if(a=='del'&&confirm('Kategorie löschen?'))S.sections.splice(si,1);
      if(a=='add')s.items.push({name:'',desc:'',price:''});
      if(a=='iup')mv(s.items,ii,-1);
      if(a=='idown')mv(s.items,ii,1);
      if(a=='dup')s.items.splice(ii+1,0,{...s.items[ii]});
      if(a=='idel')s.items.splice(ii,1);
      save();render();
    });
    app.appendChild(d);
  });
}
function toast(t){$('#toast').textContent=t;setTimeout(()=>$('#toast').textContent='',2000);}
$('#title').oninput=e=>{S.title=e.target.value;save();};
$('#addSec').onclick=()=>{S.sections.push({title:'Neue Kategorie',note:'',items:[]});save();render();window.scrollTo(0,document.body.scrollHeight);};
$('#reset').onclick=()=>{if(confirm('Alles löschen?')){S={title:'Mein Menü',sections:[]};save();render();}};
$('#apply').onclick=()=>{const p=parse($('#md').value);S={title:p.title||S.title,sections:p.sections};save();render();toast('Übernommen ✓');};
$('#copy').onclick=async()=>{await navigator.clipboard.writeText($('#md').value);toast('Kopiert ✓');};
$('#dl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([$('#md').value],{type:'text/markdown'}));a.download='menu.md';a.click();};
$('#theme').onclick=()=>{const t=document.documentElement.dataset.theme=='dark'?'light':'dark';document.documentElement.dataset.theme=t;localStorage.setItem('menu-theme',t);};
document.documentElement.dataset.theme=localStorage.getItem('menu-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
try{const x=JSON.parse(localStorage.getItem(KEY));if(x)S=x;}catch(e){}
render();$('#md').value=toMD();
</script>
</body>
</html>
